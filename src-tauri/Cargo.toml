[package]
name = "codeatlas"
version = "0.1.0"
description = "A fast visual explorer for source-code repositories"
authors = ["CodeAtlas contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "codeatlas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ignore = "0.4"
rfd = "0.15"
